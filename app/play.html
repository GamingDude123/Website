<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Playing — Wii Channel Arcade</title>
  <meta name="theme-color" content="#101418">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/wii.css">
  <style>
    body {
      background: #0d1116;
      color: #e6edf3;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
      padding-top: env(safe-area-inset-top);
    }
    body::before { display: none; }

    .play-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
      height: 40px;
      padding: 0 8px;
      background: linear-gradient(180deg, #1b232b 0%, #121820 100%);
      border-bottom: 1px solid #2b3642;
    }

    .play-bar .title {
      flex: 1;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #cbd5e1;
    }

    .play-bar button {
      height: 28px;
      padding: 0 12px;
      border: 1px solid #3a4753;
      border-radius: 999px;
      background: #232d38;
      color: #e6edf3;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .play-bar button:active { transform: scale(0.95); }

    #game {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      background: #000;
    }

    /* Reclaim the bar's height once the game is running. */
    .play-bar {
      transition: height 180ms ease, opacity 160ms ease;
      overflow: hidden;
    }
    body.is-immersive .play-bar {
      height: 0;
      opacity: 0;
      border-bottom-width: 0;
    }

    /* Always-visible grab handle: the way back when the bar is hidden. */
    #bar-handle {
      position: fixed;
      top: calc(env(safe-area-inset-top) + 0px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 108px;
      height: 26px;
      padding: 0;
      border: 0;
      border-radius: 0 0 12px 12px;
      background: rgba(70, 90, 110, 0.82);
      color: #e6edf3;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      transition: background 160ms ease;
    }
    #bar-handle::after { content: "▾  MENU"; }
    #bar-handle:active { background: rgba(90, 115, 140, 0.95); }
    body:not(.is-immersive) #bar-handle {
      top: calc(env(safe-area-inset-top) + 40px);
      background: rgba(70, 90, 110, 0.55);
    }
    body:not(.is-immersive) #bar-handle::after { content: "▴"; }

    .play-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      height: 100%;
      padding: 24px;
      text-align: center;
    }
    .play-status h1 { font-size: 19px; margin: 0; }
    .play-status p { font-size: 14px; color: #93a4b5; margin: 0; max-width: 34em; line-height: 1.55; }
    .play-status a {
      margin-top: 6px;
      padding: 10px 20px;
      border-radius: 999px;
      background: var(--wii-blue);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    /* Darker rim than the shared one, to suit the black player page. */
    .spinner { border-color: #2b3642; border-top-color: var(--wii-blue); }

    /* ---- Touch controls -------------------------------------------------
       The emulator's on-screen pad is drawn as a 1px grey outline with no
       fill, and its pressed state fills black — on a black game screen that
       is close to invisible, and there is no feedback when a press lands.
       These overrides give the controls a body, a bright edge and an obvious
       pressed state, and make them big enough for thumbs. !important is
       needed because several of these are set as inline styles. */

    .ejs_virtualGamepad_parent {
      /* Clear of the home indicator on a phone. */
      bottom: calc(46px + env(safe-area-inset-bottom)) !important;
      touch-action: none;
    }

    .ejs_virtualGamepad_button {
      width: 62px !important;
      height: 62px !important;
      line-height: 58px !important;
      font-size: 23px !important;
      font-weight: 800 !important;
      color: #fff !important;
      background: rgba(236, 244, 250, 0.22) !important;
      border: 3px solid rgba(255, 255, 255, 0.9) !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55) !important;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8) !important;
      transition: background 90ms ease, transform 90ms ease;
    }

    /* Unmistakable when a press registers. */
    .ejs_virtualGamepad_button_down {
      background: rgba(0, 158, 224, 0.92) !important;
      border-color: #fff !important;
      transform: scale(0.92);
    }

    /* Start and Select become pills. They ship absolutely positioned at fixed
       offsets, which a wider pill overruns — so the row is laid out with flex
       and those offsets are neutralised, otherwise the two overlap. */
    .ejs_virtualGamepad_bottom {
      display: flex !important;
      justify-content: center;
      gap: 14px;
      width: 240px !important;
      margin-left: -120px !important;
    }

    .ejs_virtualGamepad_bottom .ejs_virtualGamepad_button {
      position: relative !important;
      left: auto !important;
      right: auto !important;
      top: auto !important;
      width: auto !important;
      min-width: 86px;
      height: 36px !important;
      line-height: 32px !important;
      font-size: 14px !important;
      border-radius: 999px !important;
      padding: 0 14px !important;
    }

    /* A bigger d-pad, and one you can see. */
    .ejs_virtualGamepad_left,
    .ejs_virtualGamepad_right {
      width: 152px !important;
      height: 152px !important;
    }

    .ejs_dpad_main { opacity: 1 !important; }

    .ejs_dpad_horizontal { height: 46px !important; }
    .ejs_dpad_vertical { width: 46px !important; }

    /* No inner outline: the horizontal and vertical bars overlap, and two
       outlines crossing leaves a seam through the middle of the pad. */
    .ejs_dpad_bar { background: rgba(226, 238, 248, 0.32) !important; }

    /* The direction arrows ship as dark grey, which disappears on a dark
       game. Brighten them, and light the pressed one right up. */
    .ejs_dpad_horizontal:before { border-right-color: rgba(255, 255, 255, 0.85) !important; }
    .ejs_dpad_horizontal:after { border-left-color: rgba(255, 255, 255, 0.85) !important; }
    .ejs_dpad_vertical:before { border-bottom-color: rgba(255, 255, 255, 0.85) !important; }
    .ejs_dpad_vertical:after { border-top-color: rgba(255, 255, 255, 0.85) !important; }

    .ejs_dpad_left_pressed .ejs_dpad_horizontal:before,
    .ejs_dpad_right_pressed .ejs_dpad_horizontal:after,
    .ejs_dpad_up_pressed .ejs_dpad_vertical:before,
    .ejs_dpad_down_pressed .ejs_dpad_vertical:after {
      border-color: transparent !important;
    }
    .ejs_dpad_left_pressed .ejs_dpad_horizontal:before { border-right-color: #4fd0ff !important; }
    .ejs_dpad_right_pressed .ejs_dpad_horizontal:after { border-left-color: #4fd0ff !important; }
    .ejs_dpad_up_pressed .ejs_dpad_vertical:before { border-bottom-color: #4fd0ff !important; }
    .ejs_dpad_down_pressed .ejs_dpad_vertical:after { border-top-color: #4fd0ff !important; }
  </style>
</head>
<body>

  <div class="play-bar">
    <button type="button" id="btn-back">◀ Menu</button>
    <span class="title" id="play-title">Loading…</span>
    <button type="button" id="btn-full">⛶</button>
  </div>

  <button type="button" id="bar-handle" aria-label="Show or hide the menu bar"></button>

  <div id="game">
    <div class="play-status" id="status">
      <div class="spinner"></div>
      <p>Loading game…</p>
    </div>
  </div>

  <script src="js/isolation.js"></script>
  <script src="js/systems.js"></script>
  <script src="js/store.js"></script>
  <script src="js/wii-ui.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
